<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SneakHub — магазин кроссовок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <div class="logo">Sneak<span>Hub</span></div>

    <div class="search-wrap">
      <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <input type="text" id="searchInput" class="search-input" placeholder="Поиск по названию или бренду..." autocomplete="off">
      <button class="search-clear" id="searchClear" title="Очистить" type="button">×</button>
    </div>

    <div class="header-right">
      <button class="icon-btn" id="favBtn" title="Избранное" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
        </svg>
        <span class="badge" id="favBadge">0</span>
      </button>

      <button class="icon-btn" id="cartBtn" title="Корзина" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="9" cy="21" r="1"></circle>
          <circle cx="20" cy="21" r="1"></circle>
          <path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path>
        </svg>
        <span class="badge" id="cartBadge">0</span>
      </button>

      <nav class="auth" id="authBlock"></nav>
    </div>
  </header>

  <main>
    <section class="hero">
      <h1>Кроссовки твоей мечты</h1>
      <p>Оригинальные модели &bull; Быстрая доставка &bull; Лучшие цены</p>
    </section>

    <section class="catalog">
      <h2 class="section-title">Каталог</h2>
      <div class="grid" id="catalog"></div>
      <div class="empty-result hidden" id="emptyResult">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <path d="m21 21-4.35-4.35"></path>
        </svg>
        <p>По запросу ничего не найдено</p>
      </div>
    </section>
  </main>

  <footer class="footer">
    &copy; 2025 SneakHub — учебный проект
  </footer>

  <!-- Авторизация -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">
      <button class="modal-close" id="modalClose" type="button">×</button>

      <div class="tabs">
        <button class="tab active" data-tab="login" type="button">Вход</button>
        <button class="tab" data-tab="register" type="button">Регистрация</button>
      </div>

      <form class="form" id="loginForm">
        <h2>С возвращением</h2>
        <label>Email
          <input type="email" name="email" placeholder="you@mail.ru" required>
        </label>
        <label>Пароль
          <input type="password" name="password" placeholder="••••••" required>
        </label>
        <p class="form-error" id="loginError"></p>
        <button type="submit" class="btn btn-primary btn-full">Войти</button>
      </form>

      <form class="form hidden" id="registerForm">
        <h2>Создать аккаунт</h2>
        <label>Имя
          <input type="text" name="name" placeholder="Как тебя зовут?" required minlength="2">
        </label>
        <label>Email
          <input type="email" name="email" placeholder="you@mail.ru" required>
        </label>
        <label>Пароль
          <input type="password" name="password" placeholder="минимум 4 символа" required minlength="4">
        </label>
        <p class="form-error" id="registerError"></p>
        <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
      </form>
    </div>
  </div>

  <!-- Товар -->
  <div class="modal-overlay" id="productOverlay">
    <div class="modal modal-wide" id="productModal">
      <button class="modal-close" id="productClose" type="button">×</button>

      <div class="product-view">
        <div class="product-view-image" id="pvImage"></div>

        <div class="product-view-info">
          <div class="card-brand" id="pvBrand">Brand</div>
          <h2 id="pvName">Название</h2>
          <div class="pv-price" id="pvPrice">0 ₽</div>
          <p class="pv-desc" id="pvDesc">Описание</p>

          <div class="pv-sizes">
            <div class="pv-label">Размер:</div>
            <div class="sizes" id="pvSizes"></div>
          </div>

          <div class="pv-actions">
            <button class="btn btn-primary btn-full" id="pvAdd" type="button">В корзину</button>
            <button class="fav-big" id="pvFav" title="В избранное" type="button">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"></path>
              </svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Корзина -->
  <div class="modal-overlay" id="cartOverlay">
    <div class="modal" id="cartModal">
      <button class="modal-close" id="cartClose" type="button">×</button>

      <h2 class="cart-title">Корзина</h2>
      <div class="cart-list" id="cartList"></div>

      <div class="cart-footer hidden" id="cartFooter">
        <div class="cart-total">
          Итого: <span id="cartTotal">0 ₽</span>
        </div>
        <button class="btn btn-primary btn-full" id="checkoutBtn" type="button">Оформить заказ</button>
      </div>
    </div>
  </div>

  <!-- Избранное -->
  <div class="modal-overlay" id="favOverlay">
    <div class="modal" id="favModal">
      <button class="modal-close" id="favClose" type="button">×</button>

      <h2 class="cart-title">Избранное</h2>
      <div class="cart-list" id="favList"></div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="protect.js"></script>
</body>
</html>
