<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SneakHub — магазин кроссовок</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- ================= ХЕДЕР ================= -->
  <header class="header">
    <div class="logo">Sneak<span>Hub</span></div>

    <div class="header-right">
      <button class="cart-btn" id="cartBtn" title="Корзина">
        🛒
        <span class="cart-badge" id="cartBadge">0</span>
      </button>

      <nav class="auth" id="authBlock">
        <!-- JS подставит кнопки или имя пользователя -->
      </nav>
    </div>
  </header>

  <!-- ================= ОСНОВНОЙ КОНТЕНТ ================= -->
  <main>
    <section class="hero">
      <h1>Кроссовки твоей мечты</h1>
      <p>Оригинальные модели • Быстрая доставка • Лучшие цены</p>
    </section>

    <section class="catalog">
      <h2 class="section-title">Каталог</h2>
      <div class="grid" id="catalog"></div>
    </section>
  </main>

  <footer class="footer">
    © 2025 SneakHub — учебный проект
  </footer>

  <!-- ================= МОДАЛКА АВТОРИЗАЦИИ ================= -->
  <div class="modal-overlay" id="modalOverlay">
    <div class="modal" id="modal">

      <button class="modal-close" id="modalClose">✕</button>

      <div class="tabs">
        <button class="tab active" data-tab="login">Вход</button>
        <button class="tab" data-tab="register">Регистрация</button>
      </div>

      <form class="form" id="loginForm">
        <h2>С возвращением 👋</h2>
        <label>Email
          <input type="email" name="email" placeholder="you@mail.ru" required>
        </label>
        <label>Пароль
          <input type="password" name="password" placeholder="••••••" required>
        </label>
        <p class="form-error" id="loginError"></p>
        <button type="submit" class="btn btn-primary btn-full">Войти</button>
      </form>

      <form class="form hidden" id="registerForm">
        <h2>Создать аккаунт ✨</h2>
        <label>Имя
          <input type="text" name="name" placeholder="Как тебя зовут?" required minlength="2">
        </label>
        <label>Email
          <input type="email" name="email" placeholder="you@mail.ru" required>
        </label>
        <label>Пароль
          <input type="password" name="password" placeholder="минимум 4 символа" required minlength="4">
        </label>
        <p class="form-error" id="registerError"></p>
        <button type="submit" class="btn btn-primary btn-full">Зарегистрироваться</button>
      </form>

    </div>
  </div>

  <!-- ================= МОДАЛКА ТОВАРА ================= -->
  <div class="modal-overlay" id="productOverlay">
    <div class="modal modal-wide" id="productModal">
      <button class="modal-close" id="productClose">✕</button>

      <div class="product-view">
        <div class="product-view-image" id="pvImage">👟</div>

        <div class="product-view-info">
          <div class="card-brand" id="pvBrand">Brand</div>
          <h2 id="pvName">Название</h2>
          <div class="pv-price" id="pvPrice">0 ₽</div>
          <p class="pv-desc" id="pvDesc">Описание</p>

          <div class="pv-sizes">
            <div class="pv-label">Размер:</div>
            <div class="sizes" id="pvSizes"></div>
          </div>

          <button class="btn btn-primary btn-full" id="pvAdd">Добавить в корзину</button>
        </div>
      </div>
    </div>
  </div>

  <!-- ================= МОДАЛКА КОРЗИНЫ ================= -->
  <div class="modal-overlay" id="cartOverlay">
    <div class="modal" id="cartModal">
      <button class="modal-close" id="cartClose">✕</button>

      <h2 class="cart-title">Корзина 🛒</h2>

      <div class="cart-list" id="cartList"></div>

      <div class="cart-footer hidden" id="cartFooter">
        <div class="cart-total">
          Итого: <span id="cartTotal">0 ₽</span>
        </div>
        <button class="btn btn-primary btn-full" id="checkoutBtn">Оформить заказ</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
  <script src="protect.js"></script>
</body>
</html>
